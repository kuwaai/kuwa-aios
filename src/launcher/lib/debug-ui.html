<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turu Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; }
#app { display: flex; height: 100vh; }
#sidebar { width: 240px; min-width: 180px; background: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; }
#sidebar-header { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #ccc; border-bottom: 1px solid #3c3c3c; text-transform: uppercase; letter-spacing: 1px; }
#proc-list { flex: 1; overflow-y: auto; }
.proc-item { padding: 8px 16px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; }
.proc-item:hover { background: #2a2d2e; }
.proc-item.active { background: #37373d; border-left-color: #007acc; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.alive { background: #4ec9b0; }
.dot.dead { background: #f44747; }
.dot.multi { background: #569cd6; }
.pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sidebar-footer { padding: 8px 16px; border-top: 1px solid #3c3c3c; font-size: 11px; color: #888; line-height: 1.6; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#panels { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panel + .panel { border-top: 2px solid #007acc; }
.panel-header { display: flex; align-items: center; padding: 4px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; gap: 8px; flex-shrink: 0; }
.panel-header .plabel { font-size: 12px; color: #ccc; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-header button { background: #3c3c3c; color: #ccc; border: 1px solid #555; padding: 2px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; font-family: inherit; }
.panel-header button:hover { background: #505050; }
.panel-log { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; min-height: 0; }
#input-bar { display: flex; padding: 8px; background: #252526; border-top: 1px solid #3c3c3c; gap: 8px; flex-shrink: 0; }
#cmd { flex: 1; background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 6px 10px; font-family: inherit; font-size: 13px; border-radius: 3px; outline: none; }
#cmd:focus { border-color: #007acc; }
#send { background: #007acc; color: #fff; border: none; padding: 6px 16px; font-size: 13px; cursor: pointer; border-radius: 3px; font-family: inherit; }
#send:hover { background: #0098ff; }
#send:disabled, #cmd:disabled { opacity: .5; cursor: not-allowed; }
.ab { font-weight: bold; }
.ad { opacity: .7; }
.ai { font-style: italic; }
.au { text-decoration: underline; }
.f0 { color: #555; } .f1 { color: #f44747; } .f2 { color: #4ec9b0; } .f3 { color: #e5e510; }
.f4 { color: #569cd6; } .f5 { color: #c586c0; } .f6 { color: #9cdcfe; } .f7 { color: #d4d4d4; }
.f8 { color: #808080; } .f9 { color: #f14c4c; } .f10 { color: #23d18b; } .f11 { color: #f5f543; }
.f12 { color: #6fc3df; } .f13 { color: #d670d6; } .f14 { color: #29b8db; } .f15 { color: #fff; }
.dot.disabled { background: #666; }
.proc-separator { height: 1px; background: #3c3c3c; margin: 4px 8px; flex-shrink: 0; }
.proc-item.executor { flex-direction: column; align-items: flex-start; gap: 3px; padding: 7px 12px; }
.exec-label { display: flex; align-items: center; gap: 6px; width: 100%; }
.exec-actions { display: flex; gap: 3px; }
.exec-actions button { background: transparent; color: #999; border: 1px solid #555; padding: 1px 7px; font-size: 10px; cursor: pointer; border-radius: 2px; font-family: inherit; white-space: nowrap; }
.exec-actions button:hover { background: #3c3c3c; color: #d4d4d4; }
.exec-btn-stop { border-color: #c44; color: #f47; }
.exec-btn-stop:hover { background: #2a1a1a !important; }
.exec-btn-start { border-color: #3a8; color: #4ec9b0; }
.exec-btn-start:hover { background: #1a2a28 !important; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">Turu Launcher</div>
    <div id="proc-list"></div>
    <div id="sidebar-footer">
      <div id="si-host"></div>
      <div id="si-cpu"></div>
      <div id="si-mem"></div>
      <div id="si-uptime"></div>
      <div id="si-node"></div>
      <div id="si-procs"></div>
    </div>
  </div>
  <div id="main">
    <div id="panels"></div>
    <div id="input-bar">
      <input id="cmd" placeholder="Type command and press Enter..." disabled>
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>
<script>
(function() {
  var panels = document.getElementById('panels');
  var cmd = document.getElementById('cmd');
  var sendBtn = document.getElementById('send');
  var pl = document.getElementById('proc-list');

  function fmtBytes(b) {
    if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
    return (b / 1048576).toFixed(0) + ' MB';
  }
  function fmtUptime(s) {
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
  }
  function refreshSysinfo() {
    fetch('/debug/api/sysinfo').then(function(r) { return r.json(); }).then(function(si) {
      document.getElementById('si-host').textContent = si.hostname + ' (' + si.platform + '/' + si.arch + ')';
      document.getElementById('si-cpu').textContent = si.cpuModel.substring(0, 30) + ' (' + si.cpuCores + 'C)';
      document.getElementById('si-mem').textContent = 'RAM: ' + fmtBytes(si.usedMem) + ' / ' + fmtBytes(si.totalMem);
      document.getElementById('si-uptime').textContent = 'Uptime: ' + fmtUptime(si.uptime);
      document.getElementById('si-node').textContent = 'Node ' + si.nodeVersion;
      document.getElementById('si-procs').textContent = 'Processes: ' + (si.repoProcessCount || 0);
    }).catch(function() {});
  }
  refreshSysinfo();
  setInterval(refreshSysinfo, 5000);

  var active = null, procs = [];
  // active can be a process name (string) or a group name (string)
  // activeSources: array of {name, es, logEl, autoScroll, pendingHtml, renderTimer}
  var activeSources = [];
  var MAX_DOM = 524288;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var FM = {
    30:'f0',31:'f1',32:'f2',33:'f3',34:'f4',35:'f5',36:'f6',37:'f7',
    90:'f8',91:'f9',92:'f10',93:'f11',94:'f12',95:'f13',96:'f14',97:'f15'
  };

  function ansi(text) {
    var r = '', i = 0, os = 0;
    while (i < text.length) {
      var cc = text.charCodeAt(i);
      if (cc === 13) { i++; continue; }
      if (cc === 27 && text[i + 1] === '[') {
        var j = i + 2;
        while (j < text.length && text.charCodeAt(j) >= 0x20 && text.charCodeAt(j) <= 0x3f) j++;
        if (j < text.length && text.charCodeAt(j) >= 0x40 && text.charCodeAt(j) <= 0x7e) {
          if (text[j] === 'm') {
            var codes = text.substring(i + 2, j).split(';').map(Number);
            var cl = [];
            for (var k = 0; k < codes.length; k++) {
              var c = codes[k];
              if (c === 0) { while (os > 0) { r += '</span>'; os--; } }
              else if (c === 1) cl.push('ab');
              else if (c === 2) cl.push('ad');
              else if (c === 3) cl.push('ai');
              else if (c === 4) cl.push('au');
              else if (FM[c]) cl.push(FM[c]);
            }
            if (cl.length) { r += '<span class="' + cl.join(' ') + '">'; os++; }
          }
          i = j + 1; continue;
        }
      }
      r += esc(text[i]); i++;
    }
    while (os > 0) { r += '</span>'; os--; }
    return r;
  }

  function createPanel(name, opts) {
    opts = opts || {};
    var src = { name: name, es: null, logEl: null, autoScroll: true, pendingHtml: '', renderTimer: null };

    var panel = document.createElement('div');
    panel.className = 'panel';

    var header = document.createElement('div');
    header.className = 'panel-header';
    var label = document.createElement('span');
    label.className = 'plabel';
    label.textContent = name;
    header.appendChild(label);

    // Only show auto-scroll for non-overwrite (append-mode) panels
    var scrollBtn = null;
    if (!opts.overwrite) {
      scrollBtn = document.createElement('button');
      scrollBtn.textContent = 'Auto-scroll: ON';
      header.appendChild(scrollBtn);
    }

    var logEl = document.createElement('div');
    logEl.className = 'panel-log';
    src.logEl = logEl;

    panel.appendChild(header);
    panel.appendChild(logEl);
    panels.appendChild(panel);

    // Collapsed: hide log area, click header to toggle
    if (opts.collapsed) {
      var arrow = document.createElement('span');
      arrow.textContent = '\u25B6 ';
      arrow.style.fontSize = '10px';
      arrow.style.marginRight = '4px';
      label.prepend(arrow);
      logEl.style.display = 'none';
      panel.style.flex = '0 0 auto';
      header.style.cursor = 'pointer';
      header.addEventListener('click', function(e) {
        if (scrollBtn && e.target === scrollBtn) return;
        var hidden = logEl.style.display === 'none';
        logEl.style.display = hidden ? '' : 'none';
        panel.style.flex = hidden ? '1' : '0 0 auto';
        arrow.textContent = hidden ? '\u25BC ' : '\u25B6 ';
        if (hidden && src.autoScroll) logEl.scrollTop = logEl.scrollHeight;
      });
    }

    logEl.addEventListener('scroll', function() {
      src.autoScroll = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 50;
      if (scrollBtn) scrollBtn.textContent = 'Auto-scroll: ' + (src.autoScroll ? 'ON' : 'OFF');
    });
    if (scrollBtn) {
      scrollBtn.addEventListener('click', function() {
        src.autoScroll = !src.autoScroll;
        scrollBtn.textContent = 'Auto-scroll: ' + (src.autoScroll ? 'ON' : 'OFF');
        if (src.autoScroll) logEl.scrollTop = logEl.scrollHeight;
      });
    }

    function flushRender() {
      if (!src.pendingHtml) return;
      logEl.insertAdjacentHTML('beforeend', src.pendingHtml);
      src.pendingHtml = '';
      if (logEl.innerHTML.length > MAX_DOM) logEl.innerHTML = logEl.innerHTML.slice(-MAX_DOM);
      if (src.autoScroll) logEl.scrollTop = logEl.scrollHeight;
    }

    src.es = new EventSource('/debug/api/logs/' + encodeURIComponent(name));
    src.es.onmessage = function(e) {
      var d = JSON.parse(e.data);
      if (d.reset) { logEl.innerHTML = ''; src.pendingHtml = ''; }
      if (d.text) {
        src.pendingHtml += ansi(d.text);
        if (!src.renderTimer) {
          src.renderTimer = requestAnimationFrame(function() {
            src.renderTimer = null;
            flushRender();
          });
        }
      }
    };
    return src;
  }

  function teardown() {
    for (var i = 0; i < activeSources.length; i++) {
      if (activeSources[i].es) activeSources[i].es.close();
    }
    activeSources = [];
    panels.innerHTML = '';
  }

  function select(key, names) {
    if (active === key) return;
    active = key;
    teardown();

    document.querySelectorAll('.proc-item').forEach(function(e) {
      e.classList.toggle('active', e.dataset.n === key);
    });

    for (var i = 0; i < names.length; i++) {
      var p = procs.find(function(x) { return x.name === names[i]; });
      activeSources.push(createPanel(names[i], {
        overwrite: p && p.overwrite,
        collapsed: p && p.collapsed,
      }));
    }

    // stdin: use first process in group that has stdin
    var stdinTarget = null;
    for (var j = 0; j < names.length; j++) {
      var p = procs.find(function(x) { return x.name === names[j]; });
      if (p && p.alive && p.hasStdin) { stdinTarget = names[j]; break; }
    }
    cmd.disabled = !stdinTarget;
    sendBtn.disabled = !stdinTarget;
    cmd.placeholder = stdinTarget ? 'Type command and press Enter...' : 'stdin not available';
    cmd.dataset.target = stdinTarget || '';
  }

  function doSend() {
    var target = cmd.dataset.target;
    if (!target || cmd.disabled) return;
    var t = cmd.value;
    if (!t) return;
    fetch('/debug/api/stdin/' + encodeURIComponent(target), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: t + '\n'
    });
    cmd.value = '';
  }

  sendBtn.addEventListener('click', doSend);
  cmd.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSend();
  });

  var executors = [];

  function loadExecutors() {
    fetch('/debug/api/config/executors')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        executors = data.executors || [];
        buildSidebar();
      })
      .catch(function() {});
  }

  function execAction(name, action, ev) {
    ev.stopPropagation();
    fetch('/debug/api/config/executors/' + encodeURIComponent(name) + '/' + action, { method: 'POST' })
      .then(function() { loadExecutors(); })
      .catch(function() {});
  }

  function buildSidebar() {
    pl.innerHTML = '';

    // ── Service processes (build/start) — no dot ───────────────────────────
    var svcItems = [];
    var grouped = {};
    for (var i = 0; i < procs.length; i++) {
      var p = procs[i];
      if (p.name.startsWith('exec: ')) continue;
      if (p.group) {
        if (!grouped[p.group]) {
          grouped[p.group] = { names: [], alive: false };
          svcItems.push({ key: p.group, label: p.group, names: grouped[p.group].names, isGroup: true, aliveRef: grouped[p.group] });
        }
        grouped[p.group].names.push(p.name);
        if (p.alive) grouped[p.group].alive = true;
      } else {
        svcItems.push({ key: p.name, label: p.name, names: [p.name] });
      }
    }

    for (var j = 0; j < svcItems.length; j++) {
      var it = svcItems[j];
      var d = document.createElement('div');
      d.className = 'proc-item' + (active === it.key ? ' active' : '');
      d.dataset.n = it.key;
      d.innerHTML = '<span class="pname">' + esc(it.label) + '</span>';
      d.onclick = (function(key, names) { return function() { select(key, names); }; })(it.key, it.isGroup ? it.aliveRef.names : it.names);
      pl.appendChild(d);
    }

    // ── Separator + executors ──────────────────────────────────────────────
    if (executors && executors.length > 0) {
      var sep = document.createElement('div');
      sep.className = 'proc-separator';
      pl.appendChild(sep);

      // Sort: running first, then by enabled
      var sortedExecs = executors.slice().sort(function(a, b) {
        if (a.running !== b.running) return b.running - a.running;
        if (a.enabled !== b.enabled) return b.enabled - a.enabled;
        return 0;
      });

      for (var e = 0; e < sortedExecs.length; e++) {
        var ex = sortedExecs[e];
        var key = '__exec_' + ex.name;
        var d = document.createElement('div');
        d.className = 'proc-item executor' + (active === key ? ' active' : '');
        d.dataset.n = key;

        // dot: green=running, red=stopped+enabled, gray=disabled
        var dotClass = ex.running ? 'alive' : (ex.enabled ? 'dead' : 'disabled');
        d.innerHTML =
          '<span class="exec-label"><span class="dot ' + dotClass + '"></span><span class="pname">' + esc(ex.name) + '</span></span>' +
          '<span class="exec-actions"></span>';

        var actions = d.querySelector('.exec-actions');
        // Stop button: shown whenever the executor is running (even if disabled
        // in config, e.g. it was just disabled and is shutting down).
        if (ex.running) {
          var stopBtn = document.createElement('button');
          stopBtn.textContent = 'Stop';
          stopBtn.className = 'exec-btn-stop';
          stopBtn.addEventListener('click', (function(n) { return function(ev) { execAction(n, 'stop', ev); }; })(ex.name));
          actions.appendChild(stopBtn);
        } else if (ex.enabled) {
          // Enabled but not running: offer a Start button.
          var startBtn = document.createElement('button');
          startBtn.textContent = 'Start';
          startBtn.className = 'exec-btn-start';
          startBtn.addEventListener('click', (function(n) { return function(ev) { execAction(n, 'start', ev); }; })(ex.name));
          actions.appendChild(startBtn);
        }

        // Enable/Disable toggle (config.yaml).
        var togBtn = document.createElement('button');
        if (ex.enabled) {
          togBtn.textContent = 'Disable';
          togBtn.addEventListener('click', (function(n) { return function(ev) { execAction(n, 'disable', ev); }; })(ex.name));
        } else {
          togBtn.textContent = 'Enable';
          togBtn.addEventListener('click', (function(n) { return function(ev) { execAction(n, 'start', ev); }; })(ex.name));
        }
        actions.appendChild(togBtn);

        d.addEventListener('click', (function(k) { return function() { select(k); }; })(key));
        pl.appendChild(d);
      }
    }

    // ── Auto-select / restore active ───────────────────────────────────────
    var allItems = pl.querySelectorAll('.proc-item[data-n]');
    var activeStillExists = false;
    for (var ai = 0; ai < allItems.length; ai++) {
      if (allItems[ai].dataset.n === active) { activeStillExists = true; break; }
    }
    if (!active || !activeStillExists) {
      if (allItems.length) {
        var fk = allItems[0].dataset.n;
        if (fk.startsWith('__exec_')) {
          select(fk);
        } else {
          var svc = svcItems.find(function(x) { return x.key === fk; });
          if (svc) select(svc.key, svc.isGroup ? svc.aliveRef.names : svc.names);
        }
      } else {
        active = null; teardown();
        panels.innerHTML = '<div style="padding:20px;color:#888">No processes</div>';
      }
    }
    updateStdin();
  }

  function updateStdin() {
    if (active && active.startsWith('__exec_')) {
      var execName = active.slice('__exec_'.length);
      var p = procs.find(function(x) { return x.name === 'exec: ' + execName && x.alive && x.hasStdin; });
      if (p) {
        cmd.disabled = false; sendBtn.disabled = false;
        cmd.placeholder = 'Type command and press Enter...';
        cmd.dataset.target = 'exec: ' + execName;
        return;
      }
      cmd.disabled = true; sendBtn.disabled = true;
      cmd.placeholder = 'stdin not available'; cmd.dataset.target = '';
      return;
    }
    if (!active) { cmd.disabled = true; sendBtn.disabled = true; cmd.dataset.target = ''; return; }
    var stdinTarget = null;
    for (var s = 0; s < activeSources.length; s++) {
      var sp = procs.find(function(x) { return x.name === activeSources[s].name; });
      if (sp && sp.alive && sp.hasStdin) { stdinTarget = activeSources[s].name; break; }
    }
    cmd.disabled = !stdinTarget; sendBtn.disabled = !stdinTarget;
    cmd.placeholder = stdinTarget ? 'Type command and press Enter...' : 'stdin not available';
    cmd.dataset.target = stdinTarget || '';
  }

  function select(key, names) {
    if (active === key) return;
    active = key;
    teardown();
    document.querySelectorAll('.proc-item').forEach(function(e) {
      e.classList.toggle('active', e.dataset.n === key);
    });

    if (key.startsWith('__exec_')) {
      var execName = key.slice('__exec_'.length);
      var regName = 'exec: ' + execName;
      var p = procs.find(function(x) { return x.name === regName; });
      if (p) {
        activeSources.push(createPanel(regName, { overwrite: p.overwrite, collapsed: false }));
      } else {
        panels.innerHTML = '<div style="padding:20px;color:#666;font-style:italic">No log for &ldquo;' + esc(execName) + '&rdquo; &mdash; executor has not run this session.</div>';
      }
    } else {
      names = names || [];
      for (var i = 0; i < names.length; i++) {
        var p = procs.find(function(x) { return x.name === names[i]; });
        if (p) activeSources.push(createPanel(names[i], { overwrite: p.overwrite, collapsed: p.collapsed }));
      }
    }
    updateStdin();
  }

  function refresh() {
    fetch('/debug/api/processes').then(function(r) { return r.json(); }).then(function(list) {
      procs = list;
      buildSidebar();
    }).catch(function() {});
  }

  var ls = new EventSource('/debug/api/process-list');
  ls.onmessage = function() { refresh(); };
  refresh();
  loadExecutors();
  setInterval(loadExecutors, 5000);
})();
</script>
</body>
</html>
