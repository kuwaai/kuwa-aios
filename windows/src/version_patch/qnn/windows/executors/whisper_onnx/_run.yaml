version: 1
access_code: '.model:qnn/qualcomm/whisper'

# Simple declarative executor (Whisper @NPU, ONNX backend).
# Migrated from the legacy qnn run.bat.
executor:
  source: speech_recognition   # src/executor/<source>/main.py (Python executor)
  name: Whisper @NPU           # model display name
  order: 130001                # model ordering
  image: whisper.png           # model image (relative to this folder)
  command: ["--backend", "ONNX", "--model", "hf://istupakov/whisper-base-onnx", "--log", "debug"]
