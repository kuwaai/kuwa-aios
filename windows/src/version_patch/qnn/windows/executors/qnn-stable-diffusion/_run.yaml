version: 1
access_code: '.model:qnn/qualcomm/stable-diffusion'

# Simple declarative executor (Painter @NPU, Qualcomm Stable Diffusion via QNN).
# Migrated from the legacy qnn run.bat.
executor:
  source: image_generation           # src/executor/<source>/main.py (Python executor)
  script: qnn_stable_diffusion.py    # Python entry point
  name: Painter @NPU                 # model display name
  order: 120001                      # model ordering
  image: sd_qnn.png                  # model image (relative to this folder)
  command: ["--model", "qualcomm/Stable-Diffusion-v1.5", "--qnn_binaries", "..\..\..\windows\packages\qnn-binaries", "--log", "debug"]
