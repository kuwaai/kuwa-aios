version: 1
access_code: '.tool/kuwa/agent'

# Simple declarative executor (mirrors docker/compose/agent.yaml).
executor:
  source: agent          # src/executor/<source>/main.py (Python executor)
  name: My Kuwa          # model display name
  order: 999010          # model ordering
  image: agent.png       # model image (relative to this folder)
  count: 5               # number of executor processes
  command: ["--log", "debug"]
