name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: Run PR Agent
    # Run on pull requests, or on comments starting with '/' (e.g., /review, /describe)
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/'))
    steps:
      - name: PR-Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: "google"
          GOOGLE.KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini-3.5-flash"